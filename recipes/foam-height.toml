# Foam, dough or any layer rising in a vessel, side view.
id = "foam-height"
version = 2
title = "Foam or growth height"
default_mode = "continuous"
analysis_step_s = 5.0
main_measurement = "height"
curve = "logistic"
rivals = ["temperature", "evaporation", "position in the row", "handling"]
default_views = ["gauge", "curves", "target", "groups"]

[[concepts]]
name = "foam"
can_vanish = true  # foam can really collapse to nothing: an empty answer reads zero (D-90)

[[measurements]]
id = "height"
family = "size"
method = "height"
from = "foam"
unit = "mm"
